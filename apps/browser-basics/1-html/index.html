<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ponies</title>
  </head>
  <body>

          src="https://vignette.wikia.nocookie.net/mlp/images/b/bc/Princess_Twilight_Sparkle_ID_S4E26.png/revision/latest?cb=20160207045127"

        />
        <h2 class="name">Twilight Sparkle</h2>
        <p class="kind">Alicorn, Unicorn, Human</p>
      </li>
      <li class="card">
        <img
          src="https://vignette.wikia.nocookie.net/mlp/images/d/d8/Applejack_S01E13_cropped.png/revision/latest?cb=20130419182236"
          alt="Applejack"
        />
        <h2 class="name">Applejack</h2>
        <p class="kind">Earth</p>
      </li>
      <li class="card">
        <img
          src="https://vignette.wikia.nocookie.net/mlp/images/d/d6/Fluttershy_ID_S1E17.png/revision/latest?cb=20190410214903"

        <p class="kind">Pegasus</p>

      <li class="card">

          src="https://vignette.wikia.nocookie.net/mlp/images/d/d1/Rarity_standing_S1E19_CROPPED.png/revision/latest?cb=20130418142043"

        />

        <p class="kind">Unicorn</p>
      </li>
      <li class="card">

        />
        <h2 class="name">Pinkie Pie</h2>
        <p class="kind">Human, Earth</p>
      </li>
      <li class="card">
        <img
          src="https://vignette.wikia.nocookie.net/mlp/images/4/4b/Rainbow_Dash_Wonderbolt_fantasy_cropped_S1E3.png/revision/latest?cb=20190410214837"

        />
        <h2 class="name">Rainbow Dash</h2>
        <p class="kind">Pegasus</p>
      </li>
